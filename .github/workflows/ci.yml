name: CI — RAG Ingestion Engine

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run unit tests with coverage
        run: |
          pytest tests/ -v --tb=short --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  docker-build:
    name: Docker Build Smoke Test
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t rag-engine:test .

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: cp .env.example .env

      - name: Start services
        run: docker compose up -d --build --wait

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for API to be ready..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "API is healthy!"
              break
            fi
            echo "Attempt $i/30 — waiting..."
            sleep 10
          done

      - name: Run integration smoke tests
        run: |
          set -e

          echo "=== 1. Health check ==="
          curl -sf http://localhost:8000/health | jq .

          echo "=== 2. Ingest a document ==="
          RESPONSE=$(curl -sf -X POST http://localhost:8000/api/ingest \
            -H "Content-Type: application/json" \
            -d '{"text": "Machine learning is a subset of artificial intelligence that enables systems to learn from data. Neural networks are inspired by the biological brain. Deep learning uses multiple layers of neural networks to learn hierarchical representations of data.", "metadata": {"source": "ci-test"}}')
          echo "$RESPONSE" | jq .
          JOB_ID=$(echo "$RESPONSE" | jq -r '.job_id')

          echo "=== 3. Poll job status ==="
          for i in $(seq 1 30); do
            STATUS=$(curl -sf http://localhost:8000/api/status/$JOB_ID | jq -r '.status')
            echo "  Status: $STATUS"
            if [ "$STATUS" = "SUCCESS" ]; then
              echo "  Ingestion completed!"
              break
            fi
            sleep 2
          done

          echo "=== 4. Search ==="
          curl -sf -X POST http://localhost:8000/api/search \
            -H "Content-Type: application/json" \
            -d '{"query": "What is deep learning?", "top_k": 3}' | jq .

          echo "=== 5. Search again (should be cached) ==="
          curl -sf -X POST http://localhost:8000/api/search \
            -H "Content-Type: application/json" \
            -d '{"query": "What is deep learning?", "top_k": 3}' | jq '.cached'

          echo "=== 6. Prometheus metrics ==="
          curl -sf http://localhost:8000/metrics | head -20

          echo "=== All integration tests passed! ==="

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --tail=100

      - name: Tear down
        if: always()
        run: docker compose down -v
